name: release

# Pushing a tag "<package>-<version>" (for example rpaframework-core-14.0.0 or
# rpaframework-34.0.0) builds that package from the tagged commit, publishes it
# to PyPI and creates the GitHub release from the dated block of
# docs/source/releasenotes.rst that contains the version.
#
# Create the tag from master after the version-bump PR is merged:
#   cd packages/<dir> && python ../../tools/tag.py
#
# PyPI authentication: trusted publishing (OIDC) from this workflow and the
# "pypi" environment is used by default. If the repository secret
# PYPI_API_TOKEN is set, that token is used instead.

on:
  push:
    tags:
      - "rpaframework-*"

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      package: ${{ steps.parse.outputs.package }}
      dir: ${{ steps.parse.outputs.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Parse tag
        id: parse
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(echo "$TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$')
          PACKAGE="${TAG%-$VERSION}"
          if [ "$PACKAGE" = "rpaframework" ]; then
            DIR="main"
          else
            DIR="${PACKAGE#rpaframework-}"
          fi
          if [ ! -f "packages/$DIR/pyproject.toml" ]; then
            echo "::error::Tag $TAG does not map to a package directory (packages/$DIR)"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "package=$PACKAGE" >> $GITHUB_OUTPUT
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "Tag: $TAG | Package: $PACKAGE | Version: $VERSION | Directory: packages/$DIR"

      - name: Check that the tagged commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag ${{ steps.parse.outputs.tag }} points to a commit that is not on master"
            exit 1
          fi

      - name: Check that the tag matches pyproject.toml
        working-directory: packages/${{ steps.parse.outputs.dir }}
        env:
          PACKAGE: ${{ steps.parse.outputs.package }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, tomllib

          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]
          expected = (os.environ["PACKAGE"], os.environ["VERSION"])
          actual = (project["name"], project["version"])
          if actual != expected:
              print(f"::error::Tag says {expected}, pyproject.toml says {actual}")
              sys.exit(1)
          print(f"pyproject.toml matches the tag: {actual[0]} {actual[1]}")
          PYEOF

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Build sdist and wheel
        working-directory: packages/${{ steps.parse.outputs.dir }}
        run: |
          rm -rf dist
          uv build --sdist --wheel
          ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/${{ steps.parse.outputs.dir }}/dist
          # Empty when the secret is not set, which makes the action use
          # trusted publishing instead.
          password: ${{ secrets.PYPI_API_TOKEN }}

  create-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract changelog notes
        id: notes
        run: |
          python3 - <<'PYEOF'
          import re, os, sys

          rst = open("docs/source/releasenotes.rst").read()

          # Find all date-section blocks in "Released" area (after the +++ heading)
          # Each block starts with a date heading (underlined with ----) and ends at the next.
          blocks = re.split(r'\n(?=\d+ \w+ \d{4}\n-+)', rst)

          version = os.environ["VERSION"]
          package = os.environ["PACKAGE"]

          notes_block = None
          for block in blocks:
              if version in block:
                  notes_block = block
                  break

          if not notes_block:
              print(f"No changelog entry found for {package} {version}", file=sys.stderr)
              notes = f"See [release notes](https://rpaframework.org/releasenotes.html) for details."
          else:
              # Extract bullet lines
              lines = notes_block.strip().splitlines()
              bullets = []
              for line in lines:
                  if line.startswith("- "):
                      # Convert RST to Markdown:
                      # ``code`` -> `code`
                      md = re.sub(r'``(.+?)``', r'`\1`', line)
                      # :pr:`N` -> #N
                      md = re.sub(r':pr:`(\d+)`', r'#\1', md)
                      # :issue:`N` -> #N
                      md = re.sub(r':issue:`(\d+)`', r'#\1', md)
                      bullets.append(md)

              # Extract package versions listed in the block
              versions = re.findall(r'``([^`]+)``\s+\*\*([^*]+)\*\*', notes_block)
              pkg_lines = [f"- `{p}` **{v}**" for p, v in versions] if versions else []

              parts = []
              if bullets:
                  parts.append("## What's changed\n\n" + "\n".join(bullets))
              if pkg_lines:
                  parts.append("## Packages released\n\n" + "\n".join(pkg_lines))
              parts.append(
                  "## Links\n\n"
                  "- [Full release notes](https://rpaframework.org/releasenotes.html)\n"
                  "- [PyPI](https://pypi.org/project/" + package + "/#history)"
              )
              notes = "\n\n".join(parts)

          # Write to GITHUB_OUTPUT as multiline
          delimiter = "EOF_NOTES"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"notes<<{delimiter}\n{notes}\n{delimiter}\n")
          PYEOF
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          PACKAGE: ${{ needs.publish.outputs.package }}

      - name: Create GitHub Release
        # Pass values through the environment: the notes contain backticks, which
        # the shell would run as commands if they were expanded into the script.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
          TITLE: ${{ needs.publish.outputs.package }} ${{ needs.publish.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --verify-tag
