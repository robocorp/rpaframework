[project]
name = "rpaframework-meta"
version = "0.0.1"
description = "Metapackage for RPA Framework"
authors = [
	{name = "RPA Framework", email = "rpafw@robocorp.com"}
]
requires-python = ">=3.11"

dependencies = [
	"h11>=0.16.0",
	"robotframework-browser>=17.2.0",
	"rpaframework>=31.0.0",
	"rpaframework-aws>=7.0.0",
	"rpaframework-decision>=1.0.0",
	"rpaframework-google>=11.0.0",
	"rpaframework-hubspot>=3.0.0",
	"rpaframework-openai>=4.0.0",
	"rpaframework-recognition>=7.0.0",
	"rpaframework-windows>=10.0.0",
	"robotframework>=5.0.1"
]

[dependency-groups]
dev = [
	"rpaframework-devutils",
	"sphinx>=7.4.7",
	"sphinx-rtd-theme>=3.0.2",
	"sphinx-markdown-builder>=0.6.5",
	"sphinx-issues>=3.0.1",
	"sphinx-lint>=0.6.6",
	"robotframeworklexer>=1.1",
	"docutils>=0.21.2",
	"jinja2>=3.1.5",
	"markupsafe>=2.1.1"
]

[tool.uv]
package = false

override-dependencies = [
	"h11>=0.16.0",
	"protobuf>=6.33.5",
	"pillow>=13.0.0",
	"cryptography>=50.0.0",
	"requests>=2.33.0",
	"PyJWT>=2.14.0",
	"pypdf>=6.21.4",
	"pyasn1>=0.6.5",
	"lxml>=6.1.0",
	"urllib3>=2.8.0",
	"msgpack>=1.2.3",
	"setuptools>=84.1.0",
	"httplib2>=0.32.0",
	"anyio>=4.14.2",
	"soupsieve>=2.9.0",
	"certifi>=2026.10.18",
	"dnspython>=2.9.0",
	"werkzeug>=3.1.9",
	"fpdf2>=2.8.8",
	"pylint>=4.0.9",
]

[tool.uv.extra-build-dependencies]
pyobjc-core = ["setuptools"]
pyobjc-framework-applicationservices = ["setuptools"]
pyobjc-framework-cocoa = ["setuptools"]
pyobjc-framework-quartz = ["setuptools"]

[tool.uv.sources]
rpaframework = { path = "packages/main", editable = true }
rpaframework-decision = { path = "packages/decision", editable = true }
rpaframework-devutils = { path = "packages/devutils", editable = true }
rpaframework-recognition = { path = "packages/recognition", editable = true }
rpaframework-pdf = { path = "packages/pdf", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
