[project]
name = "rpaframework-sema4ai"
version = "3.0.0"
description = "Sema4.ai cloud platform library for RPA Framework: project workspace files and project information"
authors = [{name = "RPA Framework", email = "rpafw@robocorp.com"}]
license = {text = "Apache-2.0"}
readme = "README.rst"
requires-python = ">=3.11"

keywords = ["robotframework", "rpa", "automation", "sema4ai"]
classifiers = [
	"License :: OSI Approved :: Apache Software License",
	"Development Status :: 4 - Beta",
	"Operating System :: OS Independent",
	"Intended Audience :: Developers",
	"Topic :: Software Development :: Libraries :: Python Modules",
	"Topic :: Software Development :: Libraries",
	"Framework :: Robot Framework :: Library",
	"Framework :: Robot Framework",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
]

# No runtime dependencies on purpose: a Sema4.ai sandbox has no network access
# by default, so the wheel must be installable on its own.
dependencies = []

[project.urls]
homepage = "https://rpaframework.org/"
documentation = "https://rpaframework.org/"
repository = "https://github.com/robocorp/rpaframework"

[dependency-groups]
dev = [
	"rpaframework-devutils",
]

[tool.uv]
package = true

[tool.uv.sources]
rpaframework-devutils = { path = "../devutils/", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/RPA"]
include = ["src/RPA/**/*.libspec"]

[tool.pytest.ini_options]
addopts = "-v --cov=src --cov-report term-missing --cov-branch"
testpaths = ["tests"]
