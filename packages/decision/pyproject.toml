[project]
name = "rpaframework-decision"
version = "1.0.0"
description = "Decision model (System One) library for RPA Framework: typed, calibrated decisions from Jev, Laya and compatible models"
authors = [{name = "RPA Framework", email = "rpafw@robocorp.com"}]
license = {text = "Apache-2.0"}
readme = "README.rst"
requires-python = ">=3.10"

keywords = ["robotframework", "rpa", "automation", "decision-model", "jev", "laya", "system-one", "classifier"]
classifiers = [
	"License :: OSI Approved :: Apache Software License",
	"Development Status :: 4 - Beta",
	"Operating System :: OS Independent",
	"Intended Audience :: Developers",
	"Topic :: Software Development :: Libraries :: Python Modules",
	"Topic :: Software Development :: Libraries",
	"Framework :: Robot Framework :: Library",
	"Framework :: Robot Framework",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
]

dependencies = [
	"requests>=2.28.0",
	"docutils>=0.21.2",
]

[project.optional-dependencies]
# Open-weight, locally runnable decision model (ModernBERT-based). Pulls in torch.
laya = ["laya>=0.1.0"]

[project.urls]
homepage = "https://rpaframework.org/"
documentation = "https://rpaframework.org/"
repository = "https://github.com/robocorp/rpaframework"

[dependency-groups]
dev = [
	"rpaframework-devutils",
	"responses>=0.25.0",
]

[tool.uv]
package = true

[tool.uv.sources]
rpaframework-devutils = { path = "../devutils/", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/RPA"]
include = ["src/RPA/**/*.libspec"]

[tool.pytest.ini_options]
addopts = "-v --cov=src --cov-report term-missing --cov-branch"
testpaths = ["tests"]
